name: Publish Helm Chart

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/publish-helm-chart.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-helm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Helm chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package and publish charts
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          owner="${GHCR_OWNER,,}"
          chart_files=(charts/*/Chart.yaml)

          if [ "${#chart_files[@]}" -eq 0 ]; then
            echo 'No charts found under charts/*/Chart.yaml.'
            exit 0
          fi

          mkdir -p dist

          for chart_yaml in "${chart_files[@]}"; do
            chart_dir="${chart_yaml%/Chart.yaml}"
            chart_metadata="$(helm show chart "$chart_dir")"
            chart_name="$(awk -F': *' '$1 == "name" { print $2; exit }' <<<"$chart_metadata")"
            chart_version="$(awk -F': *' '$1 == "version" { print $2; exit }' <<<"$chart_metadata")"
            chart_name="${chart_name%\"}"
            chart_name="${chart_name#\"}"
            chart_version="${chart_version%\"}"
            chart_version="${chart_version#\"}"

            if [ -z "$chart_name" ] || [ -z "$chart_version" ]; then
              echo "::error file=${chart_yaml}::Chart.yaml must define name and version."
              exit 1
            fi

            if [ -f "$chart_dir/Chart.lock" ] || grep -q '^dependencies:' "$chart_yaml"; then
              helm dependency build "$chart_dir"
            fi

            helm lint "$chart_dir"

            chart_ref="oci://ghcr.io/${owner}/charts/${chart_name}"
            if helm show chart "$chart_ref" --version "$chart_version" >/dev/null 2>&1; then
              echo "::error file=${chart_yaml}::${chart_ref}:${chart_version} already exists. Bump the chart version in Chart.yaml before publishing."
              exit 1
            fi

            helm package "$chart_dir" --destination dist
          done

          for chart_package in dist/*.tgz; do
            helm push "$chart_package" "oci://ghcr.io/${owner}/charts"
          done
