<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trove</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Trove Registry</p>
        <h1>Agent artifacts, resolved exactly.</h1>
        <p class="lede">Browse seeded packages, publish a draft version, and copy exact raw URLs for agent instructions.</p>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <h2>Packages</h2>
          <button id="refresh" type="button">Refresh</button>
        </div>
        <div class="search-bar">
          <input id="search-input" type="search" placeholder="Search packages..." aria-label="Search packages" />
        </div>
        <div id="search-results" class="search-results" style="display: none;" aria-live="polite"></div>
        <div id="packages" class="package-list" aria-live="polite"></div>
      </section>

      <section class="panel detail-panel">
        <h2>Package Detail</h2>
        <div id="detail" class="detail" aria-live="polite">Select a package.</div>
        <div id="adoption" class="adsection" aria-live="polite"></div>
      </section>

      <section class="panel publish-panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Slice 2</p>
            <h2>Publish Draft</h2>
          </div>
          <span class="package-ref">companyx/platform/agent-backend</span>
        </div>
        <form id="publish-form" class="publish-form">
          <label>
            Version
            <input id="draft-version" name="version" value="1.0.1" required pattern="[0-9]+\.[0-9]+\.[0-9]+" />
          </label>
          <label>
            Manifest trove.yaml
            <textarea id="manifest-content" rows="16" spellcheck="false"></textarea>
          </label>
          <label>
            AGENTS.md
            <textarea id="agents-content" rows="8" spellcheck="false"># Updated Backend Agent Defaults

Prefer small, reviewable Go changes with tests.</textarea>
          </label>
          <button type="submit">Create, Upload, Publish</button>
        </form>
        <div id="publish-result" class="publish-result" aria-live="polite"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
