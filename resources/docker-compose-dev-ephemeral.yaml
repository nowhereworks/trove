services:
  trove-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: trove
      POSTGRES_PASSWORD: trove
      POSTGRES_DB: trove
    networks:
      - trove-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trove -d trove"]
      interval: 2s
      timeout: 5s
      retries: 20

  trove-server:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      trove-postgres:
        condition: service_healthy
    command: ["server", "--config", "/etc/trove/config.yaml"]
    volumes:
      - ./config-ephemeral.yaml:/etc/trove/config.yaml:ro
    ports:
      - "8080:8080"
    networks:
      - trove-dev

networks:
  trove-dev:
    driver: bridge
